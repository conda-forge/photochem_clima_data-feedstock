{% set name = "photochem_clima_data" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Nicholaswogan/photochem_clima_data/archive/v{{ version }}.tar.gz
  sha256: 648f81ce05199c6a9099aa3c45cf3471d7fa2890aadbd4f2740bdf688eba9b0d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools >=61.2
    - pip
  run:
    - python >=3.7
    - h5py
    - pyyaml

test:
  imports:
    - photochem_clima_data
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Nicholaswogan/photochem_clima_data
  summary: Data for Photochem and Clima packages
  license: GPL-2.0-or-later
  license_family: GPL3
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Nicholaswogan
